# EPE repository security scan. Runs on GitHub's own machines (GitHub Actions), never on our servers.
# Same file in every EPE repository; source: epe-infra security/github/security-scan.yml.
# Free replacement for GitHub's paid secret/code scanning on private repositories:
#   Trivy  - vulnerable dependencies (HIGH/CRITICAL with a fix) and leaked secrets: FAILS the run
#            misconfiguration (Dockerfiles, compose, workflows): reported, does not fail
#   ClamAV - malware in any file: FAILS the run (weekly, manual and pull requests)
# Images are pinned by digest and run directly; no third-party actions.
name: security scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  TRIVY: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 # 0.76.0
  CLAMAV: clamav/clamav@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e # 1.5 stable
jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerable dependencies and leaked secrets
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --no-progress --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - name: Misconfiguration (report only)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --no-progress --scanners misconfig \
            --severity HIGH,CRITICAL --exit-code 0 /src
  malware:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ClamAV (fresh signatures, every file)
        run: |
          docker run --rm -v "$PWD:/scan:ro" --entrypoint sh "$CLAMAV" -c \
            'freshclam --quiet --stdout && clamscan --recursive --infected --stdout /scan'
